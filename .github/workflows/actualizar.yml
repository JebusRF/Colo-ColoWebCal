name: Actualizar Colo-Colo WebCal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: |
          python actualizar_fixture.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .

          git diff --staged --quiet || git commit -m "Actualizar calendario"

          git push
